<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Портрет юриста Важаниной Александры Евгеньевны">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(217, 91%, 60%)"/>
      <stop offset="100%" stop-color="hsl(221, 83%, 35%)"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3220"/>
      <stop offset="100%" stop-color="#2a1a10"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d8be"/>
      <stop offset="100%" stop-color="#e6c4a3"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e89a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e89a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Decorative scales-of-justice icon faded -->
  <g opacity="0.07" transform="translate(310, 80)">
    <path d="M0 0 L30 0 M15 0 L15 40" stroke="white" stroke-width="2" fill="none"/>
    <path d="M0 20 Q5 30 10 20 Z M20 20 Q25 30 30 20 Z" fill="white"/>
  </g>

  <!-- Shoulders / suit -->
  <path d="M60 400 Q60 290 200 270 Q340 290 340 400 Z" fill="url(#suit)"/>
  <!-- Lapels -->
  <path d="M155 285 L200 340 L155 360 Z" fill="#0a0f1a"/>
  <path d="M245 285 L200 340 L245 360 Z" fill="#0a0f1a"/>

  <!-- White blouse triangle -->
  <path d="M180 285 L200 335 L220 285 Z" fill="#ffffff"/>
  <!-- Small pearl necklace -->
  <g fill="#f5f0e8" stroke="#cdb89a" stroke-width="0.5">
    <circle cx="185" cy="290" r="3"/>
    <circle cx="195" cy="295" r="3"/>
    <circle cx="200" cy="297" r="3.2"/>
    <circle cx="205" cy="295" r="3"/>
    <circle cx="215" cy="290" r="3"/>
  </g>

  <!-- Neck -->
  <path d="M178 270 Q200 285 222 270 L222 250 L178 250 Z" fill="url(#skin)"/>

  <!-- Face -->
  <ellipse cx="200" cy="195" rx="72" ry="88" fill="url(#skin)"/>

  <!-- Cheeks blush -->
  <ellipse cx="160" cy="215" rx="14" ry="10" fill="url(#cheek)"/>
  <ellipse cx="240" cy="215" rx="14" ry="10" fill="url(#cheek)"/>

  <!-- Hair back / behind shoulders -->
  <path d="M128 175 Q120 280 145 305 Q170 285 175 270 L175 200 Z" fill="url(#hair)"/>
  <path d="M272 175 Q280 280 255 305 Q230 285 225 270 L225 200 Z" fill="url(#hair)"/>

  <!-- Hair top (smooth, bob with side parting) -->
  <path d="M138 175 Q140 110 200 102 Q260 110 262 175 Q260 145 230 138 Q210 165 200 165 Q190 165 175 145 Q155 145 138 175 Z" fill="url(#hair)"/>

  <!-- Hair side strand framing face -->
  <path d="M138 175 Q132 220 145 260 L155 255 Q150 215 152 180 Z" fill="url(#hair)" opacity="0.95"/>
  <path d="M262 175 Q268 220 255 260 L245 255 Q250 215 248 180 Z" fill="url(#hair)" opacity="0.95"/>

  <!-- Eyebrows -->
  <path d="M168 178 Q178 173 188 178" stroke="#2a1a10" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M212 178 Q222 173 232 178" stroke="#2a1a10" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <g filter="url(#soft)">
    <ellipse cx="178" cy="195" rx="7" ry="5" fill="#ffffff"/>
    <ellipse cx="222" cy="195" rx="7" ry="5" fill="#ffffff"/>
    <circle cx="178" cy="195" r="4" fill="#4a6b3a"/>
    <circle cx="222" cy="195" r="4" fill="#4a6b3a"/>
    <circle cx="178" cy="195" r="2" fill="#1a1a1a"/>
    <circle cx="222" cy="195" r="2" fill="#1a1a1a"/>
    <circle cx="179" cy="193" r="0.8" fill="#ffffff"/>
    <circle cx="223" cy="193" r="0.8" fill="#ffffff"/>
  </g>
  <!-- Eyelashes -->
  <path d="M171 190 Q172 188 174 188 M185 190 Q184 188 182 188" stroke="#2a1a10" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M215 190 Q216 188 218 188 M229 190 Q228 188 226 188" stroke="#2a1a10" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M200 200 Q197 225 195 232 Q200 235 205 232 Q203 225 200 200" fill="none" stroke="#c9a987" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Lips -->
  <path d="M186 248 Q200 244 214 248 Q200 252 186 248 Z" fill="#c66268"/>
  <path d="M186 248 Q200 254 214 248" stroke="#a04850" stroke-width="0.8" fill="none"/>

  <!-- Subtle chin shadow -->
  <ellipse cx="200" cy="265" rx="18" ry="4" fill="#c9a987" opacity="0.25"/>
</svg>
