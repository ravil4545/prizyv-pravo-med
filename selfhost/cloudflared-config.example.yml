# =====================================================================
#  Cloudflare Tunnel. Положить в C:\Users\Ravil\.cloudflared\config.yml
#  (без слова example в имени).
#
#  Порты на роутере НЕ открываются: cloudflared сам устанавливает
#  исходящее соединение к Cloudflare. Белый IP не нужен, домашний адрес
#  в DNS не публикуется.
#
#  Перед этим:
#    cloudflared tunnel login
#    cloudflared tunnel create nepriziv
#    cloudflared tunnel route dns nepriziv nepriziv.ru
#    cloudflared tunnel route dns nepriziv www.nepriziv.ru
#    cloudflared tunnel route dns nepriziv api.nepriziv.ru
#    cloudflared service install
# =====================================================================

tunnel: nepriziv
credentials-file: C:\Users\Ravil\.cloudflared\ЗАМЕНИТЬ-НА-TUNNEL-ID.json

# Соединений к edge — четыре по умолчанию; больше домашнему каналу
# не поможет, а вот при обрыве одного остальные удержат сайт.
originRequest:
  connectTimeout: 30s
  # Разбор документа с двумя vision-вызовами идёт до полутора минут.
  # Значение по умолчанию (100s) обрывало бы ответ на середине, и человек
  # видел бы «ошибка сети» после двухминутного ожидания.
  noTLSVerify: false

ingress:
  - hostname: nepriziv.ru
    service: http://localhost:8080

  # www нужен отдельной записью: сейчас www.nepriziv.ru не резолвится
  # вообще, и посетитель, набравший адрес с www, видит ошибку DNS.
  - hostname: www.nepriziv.ru
    service: http://localhost:8080

  # API Supabase (Kong). Отдельный поддомен, а не путь: у Supabase свои
  # маршруты /auth, /rest, /storage, /functions в корне.
  - hostname: api.nepriziv.ru
    service: http://localhost:8000
    originRequest:
      # Загрузка снимков документов и SSE-ответы ИИ идут долго.
      connectTimeout: 30s

  # Studio наружу НЕ выставляется. Дашборд защищён только HTTP basic auth —
  # это не та защита, за которой держат медицинские документы. Доступ к
  # нему — локально или через Tailscale (адрес машины 100.125.37.96).

  - service: http_status:404
