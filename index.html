    <!-- Mobile error diagnostics: catches pre-React failures and shows them on screen -->
    <script>
    function _showAppError(msg) {
      var el = document.getElementById('app-loader');
      if (!el) return;
      el.innerHTML = '<div style="text-align:center;padding:1.5rem 1rem;font-family:system-ui;max-width:340px">'
        + '<p style="font-size:1rem;font-weight:600;color:#111827;margin:0 0 .4rem">Ошибка загрузки</p>'
        + '<p style="font-size:.75rem;color:#6b7280;margin:0 0 1rem;word-break:break-all">' + String(msg).slice(0, 200) + '</p>'
        + '<button onclick="sessionStorage.clear();location.reload()" style="padding:.5rem 1.25rem;background:#1a56db;color:#fff;border:none;border-radius:8px;font-size:.875rem;cursor:pointer;font-weight:500">Обновить страницу</button>'
        + '</div>';
    }
    // Catch synchronous JS errors that prevent React from starting
    window.onerror = function(msg, src, line, col, err) {
      _showAppError((err && err.message) || msg || 'Неизвестная ошибка');
      return false;
    };
    // If React hasn't mounted after 10s → show timeout with VPN hint (Russian ISPs throttle JS)
    setTimeout(function() {
      if (!document.getElementById('app-loader')) return; // React already mounted
      var el = document.getElementById('app-loader');
      if (!el) return;
      el.innerHTML = '<div style="text-align:center;padding:1.5rem 1rem;font-family:system-ui;max-width:340px">'
        + '<p style="font-size:1rem;font-weight:600;color:#111827;margin:0 0 .25rem">Сайт не загружается?</p>'
        + '<p style="font-size:.8rem;color:#6b7280;margin:0 0 .75rem">Некоторые операторы блокируют наш сайт. Включите VPN или попробуйте обновить страницу.</p>'
        + '<div style="display:flex;flex-direction:column;gap:.5rem;align-items:center">'
        + '<button onclick="sessionStorage.clear();location.reload()" style="width:200px;padding:.5rem 0;background:#1a56db;color:#fff;border:none;border-radius:8px;font-size:.875rem;cursor:pointer;font-weight:500">Обновить страницу</button>'
        + '<a href="https://t.me/nepriziv2" style="width:200px;display:block;padding:.5rem 0;background:#0ea5e9;color:#fff;text-decoration:none;border-radius:8px;font-size:.875rem;font-weight:500;box-sizing:border-box;text-align:center">Написать в Telegram</a>'
        + '</div></div>';
    }, 10000);
    </script>

  <body>
    <div id="root">
      <!-- Shown instantly before JS loads; React replaces this on mount -->
      <div id="app-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc">
        <div style="width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#1a56db;border-radius:50%;animation:spin 0.8s linear infinite"></div>
      </div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <!-- Old browsers that don't support ES modules will execute this -->
    <script nomodule>
      var el = document.getElementById('app-loader');
      if (el) el.innerHTML = '<div style="text-align:center;padding:2rem;font-family:system-ui">'
        + '<p style="font-size:1rem;font-weight:600;color:#111827;margin:0 0 .5rem">Обновите браузер</p>'
        + '<p style="font-size:.875rem;color:#6b7280">Для работы сайта нужен Chrome 80+ или Safari 14+</p></div>';
    </script>
